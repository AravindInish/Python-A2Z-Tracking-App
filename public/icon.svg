<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background with subtle squircle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="4" />

  <!-- DSA Network Nodes (Representing Graphs & Data Structures) -->
  <g stroke="#818cf8" stroke-opacity="0.4" stroke-width="6" stroke-dasharray="8 6">
    <line x1="160" y1="160" x2="352" y2="160" />
    <line x1="160" y1="160" x2="256" y2="340" />
    <line x1="352" y1="160" x2="256" y2="340" />
  </g>

  <!-- Central Python Logo / DSA Symbol -->
  <!-- Top Blue Snake Curve -->
  <path d="M 256 120 C 196 120 170 148 170 188 L 170 220 L 256 220 L 256 235 L 140 235 C 100 235 70 260 70 310 C 70 360 105 385 145 385 L 175 385 L 175 345 C 175 305 205 275 245 275 L 330 275 C 365 275 390 250 390 215 L 390 180 C 390 140 355 120 256 120 Z" fill="url(#pyBlue)" />
  <circle cx="215" cy="160" r="14" fill="#ffffff" />

  <!-- Bottom Yellow/Gold Snake Curve -->
  <path d="M 256 392 C 316 392 342 364 342 324 L 342 292 L 256 292 L 256 277 L 372 277 C 412 277 442 252 442 202 C 442 152 407 127 367 127 L 337 127 L 337 167 C 337 207 307 237 267 237 L 182 237 C 147 237 122 262 122 297 L 122 332 C 122 372 157 392 256 392 Z" fill="url(#pyYellow)" />
  <circle cx="297" cy="352" r="14" fill="#ffffff" />

  <!-- Pomodoro Tomato Emblem (Small bottom right badge) -->
  <g transform="translate(350, 350)">
    <circle cx="35" cy="35" r="35" fill="#ef4444" />
    <path d="M 35 15 Q 35 5 45 10 Q 35 12 35 15 Z" fill="#22c55e" stroke="#15803d" stroke-width="2" />
    <path d="M 30 18 Q 35 14 40 18" stroke="#15803d" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
